# Server-Image für ARM (Oracle A1) und AMD (E2.1.Micro, andere Hosts) → ghcr.io/nomisimo/planer-lager-server (Phase S).
# Enthält station-web und die Browser-Versionen beider Apps (Phase 16 W).
# Tags: sha-<kurz> und test; mit „release“ zusätzlich v<version> und latest.
name: Image

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Auch v<version> und latest setzen"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release: { type: boolean, default: false }
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency: { group: "image-${{ github.ref }}", cancel-in-progress: false }

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Version und Tags
        id: meta
        run: |
          kurz=$(git rev-parse --short=7 HEAD)
          version=$(node -p "require('./package.json').version")
          bild=ghcr.io/nomisimo/planer-lager-server
          tags="$bild:sha-$kurz,$bild:test"
          if [ "${{ inputs.release }}" = "true" ]; then tags="$tags,$bild:v$version,$bild:latest"; fi
          { echo "kurz=$kurz"; echo "commit=$(git rev-parse HEAD)"; echo "version=$version"; echo "tags=$tags"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            LAGER_VERSION=${{ steps.meta.outputs.version }}
            LAGER_COMMIT=${{ steps.meta.outputs.kurz }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Zusammenfassung
        run: |
          echo "## Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.tags }}\` (linux/arm64, linux/amd64), Version ${{ steps.meta.outputs.version }}, Commit ${{ steps.meta.outputs.kurz }}" >> "$GITHUB_STEP_SUMMARY"
